<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
@font-face{
  font-family:'Vipna';
  src:url('vipna.otf');
}
body{margin:0;background:transparent;font-family:'Vipna','Segoe UI',sans-serif}
#badge{
  position:absolute; left:20px; bottom:20px;
  display:flex; align-items:center; height:64px;
  border-radius:0; overflow:hidden;
  max-width:0;
  transition:max-width .6s cubic-bezier(.65,0,.35,1), background .4s;
}
#badge.open{max-width:420px}
#icon{width:64px;height:64px;flex:none;display:grid;place-items:center}
#icon img{width:34px;height:34px}
#name{
  white-space:nowrap; text-transform:uppercase;
  font-weight:normal; font-size:28px; letter-spacing:1px;
  padding-right:26px; margin-left:-6px;
  opacity:0; transition:opacity .25s;
}
#badge.open #name{opacity:1; transition-delay:.35s}
</style></head>
<body>
<div id="badge">
  <div id="icon"><img id="logo"></div>
  <div id="name"></div>
</div>
<script>
const items = [
  {logo:'kick.svg', text:'/keddisonn', bg:'#53FC18', fg:'#000', filter:'brightness(0)'},
  {logo:'instagram.svg', text:'/retro_keddisonn', bg:'linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5)', fg:'#fff', filter:'brightness(0) invert(1)'}
];
const OPEN_MS = 20000, CLOSED_MS = 700;
let i = 0;
const badgeEl = document.getElementById('badge');
const logoEl = document.getElementById('logo');
const nameEl = document.getElementById('name');

function show(){
  const it = items[i];
  logoEl.src = it.logo;
  logoEl.style.filter = it.filter;
  nameEl.textContent = it.text;
  nameEl.style.color = it.fg;
  badgeEl.style.background = it.bg;
  badgeEl.classList.add('open');
  setTimeout(() => {
    badgeEl.classList.remove('open');
    setTimeout(() => { i = (i + 1) % items.length; show(); }, CLOSED_MS);
  }, OPEN_MS);
}
setTimeout(show, 300);
</script>
</body></html>
