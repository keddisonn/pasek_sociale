<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">
<style>
body{margin:0;background:transparent;font-family:'Russo One','Segoe UI',sans-serif}
#badge{
  position:absolute; left:20px; bottom:20px;
  display:flex; align-items:center; height:64px;
  border-radius:0; overflow:hidden;
  max-width:0;
  background:rgba(10,10,12,.88);
  transition:max-width .6s cubic-bezier(.65,0,.35,1);
}
#badge.open{max-width:420px}
#bar{width:6px;align-self:stretch;flex:none}
#icon{width:64px;height:64px;flex:none;display:grid;place-items:center}
#tile{
  width:42px;height:42px;border-radius:9px;
  display:grid;place-items:center;
}
#tile img{width:26px;height:26px}
#name{
  white-space:nowrap; text-transform:uppercase;
  font-weight:normal; font-size:28px; letter-spacing:1px; color:#fff;
  padding-right:26px; margin-left:-4px;
  opacity:0; transition:opacity .25s;
}
#badge.open #name{opacity:1; transition-delay:.35s}

@keyframes pulse{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.08)}
}
#badge.open #tile{animation:pulse 1.4s ease-in-out infinite}
</style></head>
<body>
<div id="badge">
  <div id="bar"></div>
  <div id="icon"><div id="tile"><img id="logo"></div></div>
  <div id="name"></div>
</div>
<script>
const items = [
  {logo:'kick.svg', text:'/keddisonn', bar:'#53FC18', tile:'#53FC18', filter:'brightness(0)'},
  {logo:'instagram.svg', text:'/retro_keddisonn', bar:'linear-gradient(180deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5)', tile:'linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5)', filter:'brightness(0) invert(1)'},
  {logo:'youtube.svg', text:'/@keddisonn', bar:'#FF0000', tile:'#FF0000', filter:'brightness(0) invert(1)'}
];
const OPEN_MS = 5000, CLOSED_MS = 700;
let i = 0;
const badgeEl = document.getElementById('badge');
const logoEl = document.getElementById('logo');
const nameEl = document.getElementById('name');
const barEl = document.getElementById('bar');
const tileEl = document.getElementById('tile');

function show(){
  const it = items[i];
  logoEl.src = it.logo;
  logoEl.style.filter = it.filter;
  tileEl.style.background = it.tile;
  nameEl.textContent = it.text;
  barEl.style.background = it.bar;
  badgeEl.classList.add('open');
  setTimeout(() => {
    badgeEl.classList.remove('open');
    setTimeout(() => { i = (i + 1) % items.length; show(); }, CLOSED_MS);
  }, OPEN_MS);
}
setTimeout(show, 300);
</script>
</body></html>
