<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">
<style>
body{margin:0;background:transparent;font-family:'Russo One','Segoe UI',sans-serif}
#badge{
  position:absolute; left:20px; bottom:20px;
  display:flex; align-items:center; height:64px;
  border-radius:0; overflow:hidden;
  max-width:0;
  transition:max-width .6s cubic-bezier(.65,0,.35,1), background .4s;
}
#badge.open{max-width:420px}
#bar{width:6px;align-self:stretch;flex:none}
#icon{width:64px;height:64px;flex:none;display:grid;place-items:center}
#icon img{width:34px;height:34px}
#name{
  white-space:nowrap; text-transform:uppercase;
  font-weight:normal; font-size:28px; letter-spacing:1px;
  padding-right:26px; margin-left:-6px;
  opacity:0; transition:opacity .25s;
}
#badge.open #name{opacity:1; transition-delay:.35s}

@keyframes pulse{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.18)}
}
@keyframes glow{
  0%,100%{filter:drop-shadow(0 0 2px rgba(255,255,255,.3))}
  50%{filter:drop-shadow(0 0 9px rgba(255,255,255,1))}
}
#badge.open #icon{animation:pulse 1.2s ease-in-out infinite, glow 1.2s ease-in-out infinite}
</style></head>
<body>
<div id="badge">
  <div id="bar"></div>
  <div id="icon"><img id="logo"></div>
  <div id="name"></div>
</div>
<script>
const items = [
  {logo:'kick.svg', text:'/keddisonn', bg:'rgba(10,10,12,.88)', fg:'#fff', bar:'#53FC18', filter:'brightness(0) invert(1)'},
  {logo:'instagram.svg', text:'/retro_keddisonn', bg:'rgba(10,10,12,.88)', fg:'#fff', bar:'linear-gradient(180deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5)', filter:'brightness(0) invert(1)'},
  {logo:'youtube.svg', text:'/@keddisonn_YT', bg:'rgba(10,10,12,.88)', fg:'#fff', bar:'#FF0000', filter:'brightness(0) invert(1)'}
];
const OPEN_MS = 20000, CLOSED_MS = 700;
let i = 0;
const badgeEl = document.getElementById('badge');
const logoEl = document.getElementById('logo');
const nameEl = document.getElementById('name');
const barEl = document.getElementById('bar');

function show(){
  const it = items[i];
  logoEl.src = it.logo;
  logoEl.style.filter = it.filter;
  nameEl.textContent = it.text;
  nameEl.style.color = it.fg;
  badgeEl.style.background = it.bg;
  barEl.style.background = it.bar;
  badgeEl.classList.add('open');
  setTimeout(() => {
    badgeEl.classList.remove('open');
    setTimeout(() => { i = (i + 1) % items.length; show(); }, CLOSED_MS);
  }, OPEN_MS);
}
setTimeout(show, 300);
</script>
</body></html>
