<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">
<style>
body{margin:0;background:transparent;font-family:'Russo One','Segoe UI',sans-serif}
#badge{
  position:absolute; left:20px; bottom:20px;
  display:flex; align-items:center; height:64px;
  border-radius:0; overflow:hidden;
  max-width:6px;
  background:rgba(10,10,12,.88);
  transition:max-width .6s cubic-bezier(.65,0,.35,1);
}
#badge.open{max-width:420px}
#bar{width:6px;align-self:stretch;flex:none;position:relative}
#bar .layer{position:absolute;top:0;left:0;right:0;bottom:0;opacity:0}
#icon{width:64px;height:64px;flex:none;display:grid;place-items:center}
#tile{
  width:42px;height:42px;border-radius:9px;
  display:grid;place-items:center;
}
#tile img{width:26px;height:26px}
#name{
  white-space:nowrap; text-transform:uppercase;
  font-weight:normal; font-size:28px; letter-spacing:1px; color:#fff;
  padding-right:26px; margin-left:-4px;
  opacity:0; transition:opacity .25s;
}
#badge.open #name{opacity:1; transition-delay:.35s}

@keyframes pulse{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.08)}
}
#badge.open #tile{animation:pulse 1.4s ease-in-out infinite}
</style></head>
<body>
<div id="badge">
  <div id="bar"><div class="layer"></div><div class="layer"></div></div>
  <div id="icon"><div id="tile"><img id="logo"></div></div>
  <div id="name"></div>
</div>
<script>
const items = [
  {logo:'kick.svg', text:'/keddisonn', bar:'#53FC18', tile:'#53FC18', filter:'brightness(0)'},
  {logo:'instagram.svg', text:'/retro_keddisonn', bar:'linear-gradient(180deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5)', tile:'linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5)', filter:'brightness(0) invert(1)'}
];
// Cały cykl = OPEN_MS + CLOSED_MS + FADE_MS = 20000 ms (20 s)
const OPEN_MS = 18400, CLOSED_MS = 700, FADE_MS = 900;
let i = 0, cur = 0;
const badgeEl = document.getElementById('badge');
const logoEl = document.getElementById('logo');
const nameEl = document.getElementById('name');
const tileEl = document.getElementById('tile');
const layers = document.querySelectorAll('#bar .layer');

function setBar(bg, instant){
  const next = layers[1 - cur], old = layers[cur];
  next.style.transition = 'none';
  next.style.opacity = 0;
  next.style.background = bg;
  next.style.zIndex = 2;
  old.style.zIndex = 1;
  void next.offsetWidth;
  next.style.transition = instant ? 'none' : 'opacity ' + FADE_MS + 'ms ease';
  next.style.opacity = 1;
  cur = 1 - cur;
}

function apply(instant){
  const it = items[i];
  logoEl.src = it.logo;
  logoEl.style.filter = it.filter;
  tileEl.style.background = it.tile;
  nameEl.textContent = it.text;
  setBar(it.bar, instant);
}

function open(){
  badgeEl.classList.add('open');
  setTimeout(close, OPEN_MS);
}
function close(){
  badgeEl.classList.remove('open');
  setTimeout(next, CLOSED_MS);
}
function next(){
  i = (i + 1) % items.length;
  apply(false);
  setTimeout(open, FADE_MS);
}

apply(true);
setTimeout(open, 300);
</script>
</body></html>
